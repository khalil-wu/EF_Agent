- id: method_de
  type: method
  name: 差分熵
  aliases:
  - DE
  - differential entropy
  - DE 特征
  summary: 高斯假设下h=½log(2πeσ²)；固定长度及相应方差/能量定义下与对数能量相关。
  refs:
  - methods_de#定义
- id: method_de_libeer
  type: method
  name: LibEER 五频带 DE
  aliases:
  - libeer_filtfilt
  - de_libeer_5band
  - LibEER de_extraction
  summary: 上游整trial逐带滤波后切窗、log2/ddof1；worker别名当前逐窗滤波，二者非数值等价。
  attrs:
    bands:
    - 0.5-4
    - 4-8
    - 8-14
    - 14-30
    - 30-50
    filter: butter3 filtfilt
    log_base: 2
  refs:
  - methods_de#不同实现与兼容条件
- id: method_de_seed
  type: method
  name: SEED 五频带 DE
  aliases:
  - SEED DE
  - Zheng & Lu DE
  summary: 1–3/4–7/8–13/14–30/31–50 Hz，256 点 STFT，每秒一个特征。
  attrs:
    bands:
    - 1-3
    - 4-7
    - 8-13
    - 14-30
    - 31-50
    method: STFT
  refs:
  - methods_de#不同实现与兼容条件
- id: method_de_torcheeg
  type: method
  name: TorchEEG 四频带 DE
  aliases:
  - torcheeg_var
  - BandDifferentialEntropy
  summary: 4–8/8–14/14–31/31–49 Hz，5 阶 Butterworth 单向 lfilter。
  attrs:
    bands:
    - 4-8
    - 8-14
    - 14-31
    - 31-49
    filter: butter5 lfilter
  refs:
  - methods_de#不同实现与兼容条件
- id: method_lds
  type: method
  name: LDS 平滑
  aliases:
  - linear dynamic system
  - LDS
  - Kalman 平滑
  summary: LDS为状态空间模型；本LibEER实现全序列均值初始化后向前递推，非所有LDS都必须离线。
  refs:
  - methods_de#窗口与平滑
- id: method_psd_welch
  type: method
  name: Welch PSD
  aliases:
  - PSD
  - 功率谱密度
  - Welch
  summary: 分段周期图平均；本项目约 2 s 分段 Hamming 窗。
  refs:
  - methods_spectral#PSD 与频带功率
- id: method_bandpower
  type: method
  name: 频带功率
  aliases:
  - bandpower
  - 相对功率
  - relative power
  - 绝对功率
  summary: PSD按实际频带积分，功率单位为幅值单位平方；相对分母按产物记录，不默认全频总功率。
  refs:
  - methods_spectral#PSD 与频带功率
- id: method_faa
  type: method
  name: 额叶 alpha 不对称
  aliases:
  - FAA
  - frontal alpha asymmetry
  - alpha 不对称
  - 额叶不对称
  summary: ln(右alpha)-ln(左alpha)，记录同源电极、参考、频带；状态/特质解释依协议，单段不定情绪。
  refs:
  - methods_spectral#额叶 alpha 不对称（FAA）
- id: method_hjorth
  type: method
  name: Hjorth 参数
  aliases:
  - Hjorth
  - activity mobility complexity
  summary: activity为方差；mobility按导数/逐采样差分口径；complexity为无量纲比值。原式经Vidaurre2009全文核对，不当PSD主峰Hz。
  refs:
  - methods_spectral#时域与非线性特征
- id: method_spectral_entropy
  type: method
  name: 谱熵
  aliases:
  - spectral entropy
  summary: 归一化 PSD 的香农熵 / log(N)。
  refs:
  - methods_spectral#时域与非线性特征
