# EFAgent model contracts. Configure owned weights and an SSH executor before registering a model.
models:
  camer_deap_fixed_1s_fold0:
    display_name: CAMER · DEAP · Fixed · 1 秒
    model_version: legacy-fold0-test-selected
    task: emotion
    dataset: DEAP
    modalities:
    - eeg
    - face_video
    file_uri: null
    sha256: null
    status: pending
    input_contract_status: confirmed
    input:
      sampling_rate_hz: 128
      channels: 32
      channel_order: camer_deap
      unit: dataset_native
      reference: average
      native_container_hints:
      - deap_preprocessed
      - deap_preprocessed_trial
      preprocessing_required: deap_official_preprocessed
      input_stage: deap_preprocessed_trial
      trial_s: 63.0
      baseline_s: 3.0
      window_s: 1.0
      feature: original_mm_builder_de_lds
      feature_shape:
      - 32
      - 5
      model_input_shape:
      - 32
      - 5
      model_sampling_rate_hz: 128
      sync_required: true
      video:
        frames_per_window: 4
        size:
        - 224
        - 224
        backbone: swin_tiny
        roi: mediapipe_face_20pct
        sampling: sixteen_frames_per_four_seconds
    label_map:
    - LVLA
    - LVHA
    - HVLA
    - HVHA
    label_rule: 2 * (valence >= 5) + (arousal >= 5)
    split_protocol: five_fold_cross_trial_same_22_subjects
    checkpoint_selection: test_accuracy
    remote:
      host: efagent-inference
      python: /opt/efagent/venv/bin/python
      root: /opt/efagent
      gpu: 0
      script: camer_deap_1s_infer.py
    limitations:
    - 配置自有权重的 file_uri、sha256 和 SSH 执行器后，将 status 设为 registered。
