name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
      - name: go vet
        working-directory: gateway
        run: go vet ./...
      - name: go test
        working-directory: gateway
        run: go test ./...

  worker:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      PYTHONUTF8: '1'
      MPLBACKEND: Agg
      EEGAGENT_EMBED_PROVIDER: none
      EEGAGENT_RERANK_MODEL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install native dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk ffmpeg tesseract-ocr tesseract-ocr-chi-sim
      - name: install package
        run: python -m pip install -e ".[worker,toolbox,knowledge,test]"
      - name: verify dependencies
        run: python -m pip check
      - name: pytest
        run: python -m pytest tests -q --no-header -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install dependencies
        working-directory: frontend
        run: npm ci
      - name: typecheck
        working-directory: frontend
        run: npm run check
      - name: build
        working-directory: frontend
        run: npm run build
      - name: test
        working-directory: frontend
        run: npm test
      - name: published bundle is synchronized
        run: git diff --exit-code -- gateway/internal/server/static
